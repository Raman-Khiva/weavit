packages:
  - "apps/*"
  - "!apps/base"
  - "packages/*"
  - "tests/*"
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  msw: false
  prisma: true
  sharp: true
  unrs-resolver: true


overrides: 
  "@types/react": "19.2.15"
  "@types/react-dom": "19.2.3"
    

permissions:
  '@reduxjs/toolkit':
    skills: [modern-redux, redux-dataflow, debug-redux-toolkit-apps, migrate-to-modern-redux, adopt-rtk-query, build-slices-and-selectors, design-state-ownership, handle-side-effects]
  dotenv:
    skills: [dotenv, dotenvx]
